<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 620 478" width="620" height="478" role="img"
     aria-label="Human muscle diagram, front and back views">
  <title>Muscle diagram (front &amp; back) — muscles default to white</title>

  <!--
    HOW TO COLOR A MUSCLE
    - CSS:   add class="primary" | "secondary" | "untargeted" to a <path>
    - JS:    document.getElementById('f-pec-l').classList.add('primary')
             document.getElementById('b-lat-r').style.fill = 'orange'
    - Inline: <path id="f-quad-l" fill="#C8202F" .../>
    Front muscles = ids starting "f-", back muscles = ids starting "b-".
    "-l" / "-r" = viewer's left / right.
  -->

  <style>
    .primary    { fill: #C8202F; }
    .secondary  { fill: #F0B429; }
    .untargeted { fill: #D8D8D8; }
    .outline { fill: none; stroke: #9c9c9c; stroke-width: 2.5; stroke-linejoin: round; }
    .detail  { fill: none; stroke: #9c9c9c; stroke-width: 1.8; stroke-linecap: round; }
    .legend text { font-family: Arial, Helvetica, sans-serif; font-size: 13.5px; font-weight: 600; fill: #1a1a1a; }
  </style>

