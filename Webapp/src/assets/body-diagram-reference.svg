      C122 418 122 410 123 402 C120 380 117 352 114 331 C111 316 108 296 105 276 C103 264 102 252 102 240
      C104 228 108 216 109 202 C105 175 101 145 102 127 C102 146 100 168 96 186 C95 191 88 214 81 240
      C81 246 79 252 74 253 C68 254 62 249 63 242 C64 236 68 230 72 226 C71 222 76 198 84 172
      C87 164 90 157 90 150 C91 139 90 129 87 121 C83 115 82 107 86 100 C88 93 96 88 104 84
      C116 78 126 73 130 66 C130 62 130 59 129 56 C125 51 122 45 122 34 C123 22 130 13 140 13 Z"/>
  </defs>

